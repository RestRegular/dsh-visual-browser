# dsh-visual-browser bundle patch.
#
# One Host row: it owns the Chrome process, the five browser tools, and the
# same-origin `/visual-browser/api` route that feeds the panel (live frame,
# operation timeline, click-through). The Client half ships in the same
# package and is loaded by the Web module graph from `dsh.client`.
#
# `name` must be byte-for-byte the package.json name: the client module graph
# locates the package by the Loader row name.
- insert:
    - id: dsh-visual-browser
      name: '@restregular/dsh-visual-browser'
      config:
        headless: true
        viewport:
          width: 1280
          height: 800
